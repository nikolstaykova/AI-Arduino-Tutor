# Render blueprint: New → Blueprint → pick this repo. Free web service built
# from the Dockerfile. Set CLAUDE_CODE_OAUTH_TOKEN in the dashboard (it's a
# secret: sync false means Render asks for it and never stores it in git).
services:
  - type: web
    name: circuitquest
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
      - key: CQ_AI_BACKEND
        value: claude-code
      # accounts (Sign in with Google) + shared lessons — see cloud/SETUP.md
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # seals each learner's Claude key in the database — Render makes a random one
      - key: CQ_SECRET_KEY
        generateValue: true
      # your Google email(s): these accounts may use CLAUDE_CODE_OAUTH_TOKEN (your
      # own Claude); everyone else must connect their own Claude to create lessons
      - key: CQ_OWNER_EMAILS
        sync: false
      # shown on /privacy as where to ask for your data to be deleted
      - key: CQ_CONTACT_EMAIL
        sync: false
